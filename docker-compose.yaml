version: '3.8'

services:
  mysql:
    image: mysql:8.0.31
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: zhaosheng123
      MYSQL_DATABASE: nacos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: redis
    environment:
      - REDIS_ARGS=--requirepass zhaosheng123
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data

  nacos:
    image: nacos/nacos-server:v2.1.1
    container_name: nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: zhaosheng123
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: zhaosheng123
    ports:
      - "31589:31589"
      - "31590:31590"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":31590" --address ":31589"

  mongodb:
    image: mongo:6.0.5
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: zhaosheng123
      MONGO_INITDB_DATABASE: sapientiacloud_edupivot
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init/mongodb:/docker-entrypoint-initdb.d
    command: mongod --auth

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      CLUSTER_ID: '5YYJ085NRrijVFg9SLnVJA'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    environment:
      LIVEKIT_API_KEY: "x9!r3@k7#b2% f5^j8&m1*t4 (y6) g9q3z2w5v7s1d4h6n8"
      LIVEKIT_API_SECRET: "7p@2w!5d#8g%3j^6l&9n*1r (y4) t7z3x5c8v2b4f6k1m9"
      LIVEKIT_STUN_SERVERS: "stun:stun.cloudflare.com:3478"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        bind_addresses: ["0.0.0.0"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50010
          use_external_ip: true
          # 你也可以在这里添加 stun_servers，效果是一样的
          # stun_servers:
          #   - url: stun:stun.cloudflare.com:3478
        keys:
          "x9!r3@k7#b2% f5^j8&m1*t4 (y6) g9q3z2w5v7s1d4h6n8": "7p@2w!5d#8g%3j^6l&9n*1r (y4) t7z3x5c8v2b4f6k1m9"
    ports:
      - "7880:7880/tcp"       # HTTP API 和 WebSocket 信令
      - "7881:7881/tcp"       # TCP 回退（用于防火墙严格的环境）
      - "50000-50010:50000-50010/udp" # UDP 媒体流端口
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  mongodb_data:
  kafka_data: