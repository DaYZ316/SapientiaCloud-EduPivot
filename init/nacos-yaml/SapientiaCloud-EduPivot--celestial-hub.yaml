pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

mybatis-plus:
  type-aliases-package: com.dayz.sapientiacloud_edupivot.celestial_hub.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    cache-enabled: false
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      update-strategy: not_null
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full
  httpclient:
    enabled: true

spring:
  mvc:
    async:
      request-timeout: -1
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
  data:
    mongodb:
      host: ${MONGODB_HOST}
      port: ${MONGODB_PORT}
      database: ${MONGODB_DATABASE}
      username: ${MONGODB_USERNAME}
      password: ${MONGODB_PASSWORD}
      authentication-database: ${MONGODB_AUTH_DATABASE}
      type-mapper: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
      compression-type: snappy
      batch-size: 16384
      linger-ms: 10
      buffer-memory: 33554432
    consumer:
      group-id: chat-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    topic:
      chat-request: chat-request-topic
      chat-response: chat-response-topic
      file-vectorize: file-vectorize-topic
      question-request: question-request-topic
      question-response: question-response-topic
      question-progress: question-progress-topic
  ai:
    dashscope:
      api-key: sk-20c0c396a3f64130ac4c56c1a4b3aa00
      chat:
        options:
          model: qwen3-max
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v1
    vectorstore:
      redis:
        index-name: knowledge-vector-index
        prefix: vector
        initialize-schema: true

kafka:
  chat:
    timeout-seconds: 300
    sink-cache:
      expire-after-write-minutes: 10
      maximum-size: 1000
  question:
    stage-min-duration-ms: ${QUESTION_STAGE_MIN_DURATION_MS:2000}
    sse-heartbeat-seconds: ${QUESTION_SSE_HEARTBEAT_SECONDS:8}

agent:
  skills:
    external-search:
      enabled: false
    opentdb:
      enabled: true
      base-url: https://opentdb.com
      api-path: /api.php
      connect-timeout-seconds: 5
      request-timeout-seconds: 12

avatar:
  tts:
    enabled: true
    auto-generate: true
    worker-base-url: ${AVATAR_TTS_WORKER_BASE_URL:http://127.0.0.1:32111}
    worker-synthesize-path: ${AVATAR_TTS_WORKER_SYNTHESIZE_PATH:/tts/synthesize}
    default-voice-code: ${AVATAR_TTS_DEFAULT_VOICE_CODE:teacher-default}
    default-audio-format: ${AVATAR_TTS_DEFAULT_AUDIO_FORMAT:wav}
    max-text-length: ${AVATAR_TTS_MAX_TEXT_LENGTH:2000}
    upload-directory: ${AVATAR_TTS_UPLOAD_DIRECTORY:avatar-audio/}
    bucket-code: ${AVATAR_TTS_BUCKET_CODE:AI_QA_ASSET}

MONGODB_HOST: localhost
MONGODB_PORT: 27017
MONGODB_DATABASE: sapientiacloud_edupivot
MONGODB_USERNAME: root
MONGODB_PASSWORD: zhaosheng123
MONGODB_AUTH_DATABASE: admin

KAFKA_BOOTSTRAP_SERVERS: localhost:9092
QUESTION_STAGE_MIN_DURATION_MS: 2000
QUESTION_SSE_HEARTBEAT_SECONDS: 8
TONGYI_API_KEY:
